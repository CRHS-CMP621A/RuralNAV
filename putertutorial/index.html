
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webcam API Tutorial</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 20px;
      }
      .container {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
      }
      video {
        background: #333;
        border-radius: 8px;
        width: 100%;
        max-width: 400px;
        height: auto;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <h1>Live Webcam Stream</h1>

    <div class="container">
      <!-- Live stream container -->
      <div>
        <h3>Live Feed</h3>
        <video id="webcam" autoplay playsinline></video>
      </div>
    </div>

    <!-- PUTER OCR -->
    <div>
      <h3>Webcam OCR</h3>
      <button onclick="processImage()">Process Image</button>

      <div style="margin-top: 20px">
        <h4>Preview:</h4>
        <img id="preview" style="max-width: 500px; display: none" />
      </div>

      <div style="margin-top: 20px">
        <h4>Extracted Text:</h4>
        <div id="result" style="white-space: pre-wrap"></div>
      </div>
    </div>

    <script src="https://js.puter.com/v2/"></script>
    <script src="script.js"></script>
  </body>
</html>
